name: CI/CD Pipeline

on:
  push:
    branches: [main, stable, stable_final]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Stage 1 — Lint & Format Check
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: pip install "flake8==7.3.0" "black==26.5.1"

      - name: Black format check
        run: black --check --diff app/ tests/ eval/

      - name: Flake8 lint
        run: flake8 app/ tests/ eval/

  # ─────────────────────────────────────────────────────────────────
  # Stage 2 — Unit Tests (80% coverage threshold)
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    env:
      OPENAI_API_KEY: ci-mock-key
      LANGCHAIN_API_KEY: ci-mock-key
      LANGCHAIN_TRACING_V2: "false"
      JWT_SECRET_KEY: ci-test-secret
      DATABASE_URL: sqlite:///./test.db

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: |
          python -m pytest \
            -m "not integration" \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ─────────────────────────────────────────────────────────────────
  # Stage 3 — LLM Evaluation (DeepEval, fixture / CI mode)
  # ─────────────────────────────────────────────────────────────────
  evaluate:
    name: LLM Evaluation
    runs-on: ubuntu-latest
    needs: test

    env:
      OPENAI_API_KEY: ci-mock-key
      LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      # RUN_LIVE_EVAL is intentionally NOT set → fixture mode

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run DeepEval evaluation
        run: python eval/run_deepeval.py

      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: eval-reports
          path: |
            eval/reports/eval_report.json
            eval/reports/eval_report.html

  # ─────────────────────────────────────────────────────────────────
  # Stage 4 — Docker Build
  # ─────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: evaluate

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────
  # Stage 5 — Push to Registry  (stable branch push only)
  # ─────────────────────────────────────────────────────────────────
  push-image:
    name: Push to Registry
    runs-on: ubuntu-latest
    needs: docker-build
    if: needs.docker-build.result == 'success' && (github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/stable_final') && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────
  # Stage 6 — Deploy to Kubernetes via Helm  (stable branch push only)
  # Requires KUBECONFIG and APP_URL repository secrets.
  # Skips gracefully with a warning if secrets are not configured.
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted
    needs: push-image
    # Explicitly require push-image to have SUCCEEDED (not just skipped/failed)
    # Without needs.push-image.result == 'success', GitHub may run this job
    # even when push-image was skipped due to its own if-condition being false.
    if: needs.push-image.result == 'success' && (github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/stable_final') && github.event_name == 'push'
    environment: production
    continue-on-error: true  # deployment is best-effort; requires a live cluster

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Check deployment prerequisites
        id: prereqs
        run: |
          if [ -z "$KUBECONFIG_SECRET" ]; then
            echo "::warning::KUBECONFIG secret is not set — skipping Kubernetes deployment."
            echo "To enable: add KUBECONFIG (base64-encoded kubeconfig) as a repository secret."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}

      - name: Install Helm
        if: steps.prereqs.outputs.configured == 'true'
        uses: azure/setup-helm@v4

      - name: Configure kubectl
        if: steps.prereqs.outputs.configured == 'true'
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > /tmp/kubeconfig.yaml
          echo "KUBECONFIG=/tmp/kubeconfig.yaml" >> $GITHUB_ENV

      - name: Create ghcr.io image pull secret
        if: steps.prereqs.outputs.configured == 'true'
        run: |
          kubectl create namespace multi-agent --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --namespace=multi-agent \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        id: helm-deploy
        if: steps.prereqs.outputs.configured == 'true'
        run: |
          IMAGE_REPO=$(echo "ghcr.io/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          helm upgrade --install multi-agent-system ./helm \
            --namespace multi-agent \
            --create-namespace \
            --values helm/values.yaml \
            --values helm/values-prod.yaml \
            --set app.image.tag=$IMAGE_TAG \
            --set app.image.repository=$IMAGE_REPO \
            --set app.image.pullSecrets[0]=ghcr-secret \
            --set-string secrets.openaiApiKey=${{ secrets.OPENAI_API_KEY }} \
            --set-string secrets.langchainApiKey=${{ secrets.LANGCHAIN_API_KEY }} \
            --set-string secrets.jwtSecretKey=${{ secrets.JWT_SECRET_KEY }} \
            --set-string secrets.googleClientId=${{ secrets.GOOGLE_CLIENT_ID }} \
            --set-string secrets.googleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }} \
            --set-string postgres.auth.password=${{ secrets.POSTGRES_PASSWORD }} \
            --timeout 5m \
            --wait

      - name: Smoke test — health check
        id: smoke-test
        if: steps.prereqs.outputs.configured == 'true'
        run: |
          kubectl port-forward -n multi-agent svc/multi-agent-system-app 8080:80 &
          PF_PID=$!
          sleep 5
          echo "Hitting health endpoint via port-forward..."
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (HTTP $STATUS)"
              kill $PF_PID 2>/dev/null || true
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          kill $PF_PID 2>/dev/null || true
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Rollback on smoke-test failure
        if: steps.prereqs.outputs.configured == 'true' && failure() && steps.smoke-test.outcome == 'failure'
        run: |
          echo "Smoke test failed — rolling back Helm release..."
          REVISIONS=$(helm history multi-agent-system --namespace multi-agent --max 2 -o json | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          if [ "$REVISIONS" -gt 1 ]; then
            helm rollback multi-agent-system --namespace multi-agent
            echo "Rollback complete"
          else
            echo "First install — uninstalling instead of rolling back"
            helm uninstall multi-agent-system --namespace multi-agent
          fi
