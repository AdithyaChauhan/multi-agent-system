name: CI/CD Pipeline

on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Stage 1 — Lint & Format Check
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: pip install "flake8==7.3.0" "black==26.5.1"

      - name: Black format check
        run: black --check --diff app/ tests/ eval/

      - name: Flake8 lint
        run: flake8 app/ tests/ eval/

  # ─────────────────────────────────────────────────────────────────
  # Stage 2 — Unit Tests (70 % coverage threshold)
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    env:
      OPENAI_API_KEY: ci-mock-key
      LANGCHAIN_API_KEY: ci-mock-key
      LANGCHAIN_TRACING_V2: "false"
      JWT_SECRET_KEY: ci-test-secret
      DATABASE_URL: sqlite:///./test.db

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: |
          python -m pytest \
            -m "not integration" \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ─────────────────────────────────────────────────────────────────
  # Stage 3 — LLM Evaluation (DeepEval, fixture / CI mode)
  # ─────────────────────────────────────────────────────────────────
  evaluate:
    name: LLM Evaluation
    runs-on: ubuntu-latest
    needs: test

    env:
      OPENAI_API_KEY: ci-mock-key
      LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      # RUN_LIVE_EVAL is intentionally NOT set → fixture mode

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run DeepEval evaluation
        run: python eval/run_deepeval.py

      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: |
            eval/reports/eval_report.json
            eval/reports/eval_report.html

  # ─────────────────────────────────────────────────────────────────
  # Stage 4 — Docker Build
  # ─────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: evaluate

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────
  # Stage 5 — Push to Registry  (main branch only)
  # ─────────────────────────────────────────────────────────────────
  push-image:
    name: Push to Registry
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────
  # Stage 6 — Deploy to Kubernetes via Helm  (main branch only)
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: push-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Deploy with Helm
        id: helm-deploy
        run: |
          helm upgrade --install multi-agent-system ./helm \
            --namespace multi-agent \
            --create-namespace \
            --values helm/values.yaml \
            --values helm/values-prod.yaml \
            --set app.image.tag=${{ github.sha }} \
            --set app.image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --timeout 5m \
            --wait

      - name: Smoke test — health check
        id: smoke-test
        run: |
          APP_URL="${{ secrets.APP_URL }}"
          echo "Hitting health endpoint at $APP_URL/health ..."
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Rollback on smoke-test failure
        if: failure() && steps.smoke-test.outcome == 'failure'
        run: |
          echo "Smoke test failed — rolling back Helm release..."
          helm rollback multi-agent-system --namespace multi-agent
          echo "Rollback complete"
