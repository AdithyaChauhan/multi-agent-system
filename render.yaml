# Render blueprint for the public demo (ADR 0016): one free web service.
# - The database is Neon's free Postgres (pgvector, never expires): paste its URL as DATABASE_URL.
#   Load it once from your machine with scripts/load_live_db.sh (see docs/SETUP.md).
# - The mock carrier API runs inside the app at /carrier, so one service is enough (750 free hours a month).
# - an outside monitor (UptimeRobot, every 5 minutes) pings /health so the free service doesn't sleep;
#   .github/workflows/keep-warm.yml is a backup (GitHub runs its schedule only every few hours).
# Secrets marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: multi-agent-chatbot
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ESCALATION_WEBHOOK_URL
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_FALLBACK_MODELS
        value: openai/gpt-oss-120b,qwen/qwen3.8-27b
      - key: PRODUCT_SEARCH
        value: hybrid
      - key: MOCK_CARRIER_API_URL
        value: http://localhost:10000/carrier
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRATION_HOURS
        value: "24"
      - key: SESSION_EXPIRY_MINUTES
        value: "60"
      - key: LANGCHAIN_TRACING_V2
        value: "false"
      # Optional: Google sign-in. Leave unset and the demo-shopper button still works.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
