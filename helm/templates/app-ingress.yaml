{{- if .Values.app.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "multi-agent.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "multi-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
  {{- with .Values.app.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.app.ingress.className }}
  ingressClassName: {{ .Values.app.ingress.className }}
  {{- end }}
  {{- if .Values.app.ingress.tls }}
  tls:
    {{- toYaml .Values.app.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.app.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "multi-agent.fullname" . }}-app
                port:
                  number: {{ .Values.app.service.port }}
{{- end }}
