{{/*
Only create the Secret when secrets.existingSecret is not set.
When existingSecret IS set, the operator is expected to have created the
Secret out-of-band (e.g. via External Secrets Operator or Vault).

All secret values are supplied at deploy time via --set-string flags passed
from GitHub Actions secrets — they are never stored in any values file.
*/}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "multi-agent.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "multi-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  LANGCHAIN_API_KEY: {{ .Values.secrets.langchainApiKey | quote }}
  LANGSMITH_API_KEY: {{ .Values.secrets.langchainApiKey | quote }}
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  {{- if .Values.monitoring.enabled }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.monitoring.grafana.adminPassword | quote }}
  {{- end }}
{{- end }}
