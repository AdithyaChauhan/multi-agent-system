apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "multi-agent.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "multi-agent.labels" . | nindent 4 }}
data:
  SESSION_EXPIRY_MINUTES: {{ .Values.config.sessionExpiryMinutes | quote }}
  LANGCHAIN_TRACING_V2: {{ .Values.config.langchainTracingV2 | quote }}
  LANGSMITH_TRACING: {{ .Values.config.langchainTracingV2 | quote }}
  LANGCHAIN_ENDPOINT: {{ .Values.config.langchainEndpoint | quote }}
  LANGSMITH_ENDPOINT: {{ .Values.config.langchainEndpoint | quote }}
  LANGCHAIN_PROJECT: {{ .Values.config.langchainProject | quote }}
  LANGSMITH_PROJECT: {{ .Values.config.langchainProject | quote }}
  JWT_ALGORITHM: {{ .Values.config.jwtAlgorithm | quote }}
  JWT_EXPIRATION_HOURS: {{ .Values.config.jwtExpirationHours | quote }}
  GOOGLE_REDIRECT_URI: {{ .Values.config.googleRedirectUri | quote }}
  MOCK_CARRIER_API_URL: {{ printf "http://%s:%d" (include "multi-agent.mockApiServiceName" .) (int .Values.mockApi.service.port) | quote }}
