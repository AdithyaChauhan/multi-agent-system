apiVersion: v1
kind: Service
metadata:
  name: {{ include "multi-agent.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "multi-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: {{ .Values.app.service.type }}
  ports:
    - port: {{ .Values.app.service.port }}
      targetPort: {{ .Values.app.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "multi-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
