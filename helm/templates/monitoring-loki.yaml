{{- if .Values.monitoring.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "multi-agent.fullname" . }}-loki-data
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "multi-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.monitoring.loki.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "multi-agent.fullname" . }}-loki
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "multi-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "multi-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: loki
  template:
    metadata:
      labels:
        {{- include "multi-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: loki
    spec:
      securityContext:
        runAsUser: 0
      containers:
        - name: loki
          image: "{{ .Values.monitoring.loki.image.repository }}:{{ .Values.monitoring.loki.image.tag }}"
          args: ["-config.file=/etc/loki/local-config.yaml"]
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: loki-data
              mountPath: /loki
          resources:
            {{- toYaml .Values.monitoring.loki.resources | nindent 12 }}
      volumes:
        - name: loki-data
          persistentVolumeClaim:
            claimName: {{ include "multi-agent.fullname" . }}-loki-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "multi-agent.fullname" . }}-loki
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "multi-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.monitoring.loki.service.port }}
      targetPort: 3100
      protocol: TCP
      name: http
  selector:
    {{- include "multi-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: loki
{{- end }}
