{{- if .Values.monitoring.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "multi-agent.fullname" . }}-grafana-datasources
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "multi-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://{{ include "multi-agent.prometheusServiceName" . }}:{{ .Values.monitoring.prometheus.service.port }}
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://{{ include "multi-agent.fullname" . }}-loki:{{ .Values.monitoring.loki.service.port }}
        isDefault: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "multi-agent.fullname" . }}-grafana-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "multi-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards
          foldersFromFilesStructure: false
  dashboard.json: |
{{ .Files.Get "dashboards/dashboard.json" | indent 4 }}
{{- $existingGrafanaPvc := lookup "v1" "PersistentVolumeClaim" .Release.Namespace (printf "%s-grafana-data" (include "multi-agent.fullname" .)) }}
{{- if not $existingGrafanaPvc }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "multi-agent.fullname" . }}-grafana-data
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "multi-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.monitoring.grafana.persistence.size }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "multi-agent.fullname" . }}-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "multi-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "multi-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "multi-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
    spec:
      containers:
        - name: grafana
          image: "{{ .Values.monitoring.grafana.image.repository }}:{{ .Values.monitoring.grafana.image.tag }}"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.monitoring.grafana.adminUser | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "multi-agent.secretName" . }}
                  key: GRAFANA_ADMIN_PASSWORD
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards-config
              mountPath: /etc/grafana/provisioning/dashboards
          resources:
            {{- toYaml .Values.monitoring.grafana.resources | nindent 12 }}
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: {{ include "multi-agent.fullname" . }}-grafana-data
        - name: grafana-datasources
          configMap:
            name: {{ include "multi-agent.fullname" . }}-grafana-datasources
        - name: grafana-dashboards-config
          configMap:
            name: {{ include "multi-agent.fullname" . }}-grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "multi-agent.fullname" . }}-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "multi-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.monitoring.grafana.service.port }}
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    {{- include "multi-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
{{- end }}
