apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "multi-agent.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "multi-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      {{- include "multi-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "multi-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
      annotations:
        # Roll pods when the ConfigMap or Secret changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- if .Values.app.image.pullSecrets }}
      imagePullSecrets:
        {{- range .Values.app.image.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # Non-secret env vars come from the ConfigMap
          envFrom:
            - configMapRef:
                name: {{ include "multi-agent.configMapName" . }}
            - secretRef:
                name: {{ include "multi-agent.secretName" . }}
          # DATABASE_URL — overridable via .Values.app.databaseUrl (used in prod to point at host postgres)
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "multi-agent.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              {{- if .Values.app.databaseUrl }}
              value: {{ .Values.app.databaseUrl | quote }}
              {{- else }}
              value: "postgresql://{{ .Values.postgres.auth.username }}:$(POSTGRES_PASSWORD)@{{ include "multi-agent.postgresServiceName" . }}:{{ .Values.postgres.service.port }}/{{ .Values.postgres.auth.database }}"
              {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: {{ .Values.app.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.app.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.app.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.app.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: {{ .Values.app.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.app.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.app.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.app.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
