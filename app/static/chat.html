<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Agent E-commerce Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ── */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0 1.5rem;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-logo {
            width: 40px; height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; flex-shrink: 0;
        }
        .header-title { font-size: 1.05rem; font-weight: 600; }
        .header-subtitle { font-size: 0.78rem; opacity: 0.85; margin-top: 1px; }
        .header-right { display: flex; gap: 8px; }
        .btn-header {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 7px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.82rem;
            display: flex; align-items: center; gap: 6px;
            transition: background 0.2s;
        }
        .btn-header:hover { background: rgba(255,255,255,0.28); }
        .btn-logout {
            background: white; color: #667eea;
            border: none; padding: 7px 16px;
            border-radius: 20px; cursor: pointer;
            font-size: 0.82rem; font-weight: 600;
            display: flex; align-items: center; gap: 6px;
        }

        /* ── Guest banner ── */
        .guest-banner {
            background: #fff3cd; color: #856404;
            padding: 0.5rem 1.5rem;
            font-size: 0.83rem; text-align: center; flex-shrink: 0;
        }

        /* ── Main layout ── */
        .layout { display: flex; flex: 1; overflow: hidden; }

        /* ── Sidebar ── */
        .sidebar {
            width: 280px; flex-shrink: 0;
            padding: 1.25rem;
            display: flex; flex-direction: column; gap: 1rem;
            overflow-y: auto;
            background: white;
            border-right: 1px solid #e0e0e0;
        }
        .sidebar-card {
            background: #f8f9ff; border-radius: 12px;
            padding: 1.1rem;
            border: 1px solid #eeeeff;
        }
        .sidebar-card h3 {
            font-size: 0.75rem; font-weight: 700;
            color: #667eea; text-transform: uppercase;
            letter-spacing: 0.06em; margin-bottom: 0.75rem;
        }
        .quick-btn {
            width: 100%;
            background: #f5f5ff; border: 1px solid #e8e8ff;
            color: #333; padding: 9px 12px;
            border-radius: 8px; cursor: pointer;
            font-size: 0.87rem; text-align: left;
            display: flex; align-items: center; gap: 10px;
            transition: background 0.15s; margin-bottom: 6px;
        }
        .quick-btn:last-child { margin-bottom: 0; }
        .quick-btn:hover { background: #ebebff; }
        .qicon {
            width: 28px; height: 28px;
            background: #667eea; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; flex-shrink: 0;
        }
        .tip-header { display: flex; align-items: center; gap: 6px; margin-bottom: 0.5rem; }
        .tip-header h3 { color: #f59e0b; }
        .tip-text { font-size: 0.83rem; color: #777; line-height: 1.55; }
        .sidebar-spacer { flex: 1; }

        /* ── Chat area ── */
        .chat-area {
            flex: 1; display: flex; flex-direction: column;
            overflow: hidden; padding: 1.25rem 1.25rem 0;
        }
        .chat-container {
            flex: 1; overflow-y: auto;
            display: flex; flex-direction: column; gap: 1.1rem;
            padding-bottom: 1rem;
        }

        /* ── Message rows ── */
        .msg-row { display: flex; align-items: flex-start; gap: 10px; }
        .msg-row.user { flex-direction: row-reverse; }

        .bot-avatar {
            width: 34px; height: 34px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; flex-shrink: 0; margin-top: 2px;
        }

        .msg-col { display: flex; flex-direction: column; max-width: 75%; }
        .msg-row.user .msg-col { align-items: flex-end; max-width: 65%; }

        .message {
            padding: 0.85rem 1.1rem;
            border-radius: 16px;
            line-height: 1.55; font-size: 0.93rem;
        }
        .message.user {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border-bottom-right-radius: 4px;
        }
        .message.assistant {
            background: white; color: #2d2d2d;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        /* markdown inside assistant bubbles */
        .message.assistant p { margin-bottom: 0.5rem; }
        .message.assistant p:last-child { margin-bottom: 0; }
        .message.assistant ul, .message.assistant ol { padding-left: 1.4rem; margin: 0.4rem 0; }
        .message.assistant li { margin-bottom: 0.2rem; }
        .message.assistant strong { font-weight: 600; }
        .message.assistant em { font-style: italic; color: #666; }
        .message.assistant code { background: #f0f0f0; padding: 2px 5px; border-radius: 4px; font-size: 0.88em; font-family: 'Courier New', monospace; }

        .msg-meta {
            font-size: 0.7rem; color: #bbb;
            margin-top: 4px; display: flex; align-items: center; gap: 4px;
        }
        .msg-row.user .msg-meta { flex-direction: row-reverse; }
        .tick { color: #667eea; }

        /* ── Order cards ── */
        .order-cards { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
        .order-card {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 14px;
            background: #fafafa; border: 1px solid #efefef;
            border-radius: 10px; cursor: pointer;
            transition: background 0.15s;
        }
        .order-card:hover { background: #f0f0ff; border-color: #d0d0ff; }
        .order-icon {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; flex-shrink: 0;
        }
        .order-info { flex: 1; min-width: 0; }
        .order-id { font-weight: 700; font-size: 0.88rem; color: #222; }
        .order-name { font-size: 0.79rem; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
        .status-badge { font-size: 0.72rem; font-weight: 600; padding: 3px 9px; border-radius: 20px; flex-shrink: 0; }
        .order-chevron { color: #ccc; font-size: 1rem; flex-shrink: 0; }

        /* ── Typing indicator ── */
        .typing-row { display: flex; align-items: flex-start; gap: 10px; }
        .typing {
            padding: 0.85rem 1.1rem; background: white;
            border-radius: 16px; border-bottom-left-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .typing span {
            display: inline-block; width: 7px; height: 7px;
            background: #667eea; border-radius: 50%; margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* ── Input ── */
        .input-container {
            background: white; padding: 0.85rem 1rem;
            margin: 0 -1.25rem;
            border-top: 1px solid #e8e8e8;
            display: flex; align-items: center; gap: 8px;
        }
        .attach-btn {
            background: none; border: none; color: #bbb;
            font-size: 1.1rem; cursor: pointer; padding: 6px;
            border-radius: 50%; transition: background 0.15s;
        }
        .attach-btn:hover { background: #f0f0f0; color: #888; }
        #messageInput {
            flex: 1; padding: 0.65rem 1rem;
            border: 1.5px solid #e4e4e4; border-radius: 24px;
            font-size: 0.93rem; outline: none;
            background: #f8f8f8; transition: border-color 0.2s, background 0.2s;
        }
        #messageInput:focus { border-color: #667eea; background: white; }
        #sendButton {
            padding: 0.65rem 1.2rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border: none; border-radius: 24px;
            font-size: 0.88rem; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 6px;
            transition: opacity 0.2s;
        }
        #sendButton:hover:not(:disabled) { opacity: 0.88; }
        #sendButton:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="header-logo">🤖</div>
            <div>
                <div class="header-title">Multi-Agent E-commerce Assistant</div>
                <div class="header-subtitle" id="userInfo">Loading...</div>
            </div>
        </div>
        <div class="header-right" id="headerButtons"></div>
    </div>

    <div id="guestBanner" style="display:none" class="guest-banner">
        ⚠️ Browsing as guest — <strong>sign in</strong> to track orders and raise support tickets.
    </div>

    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-card">
                <h3>Quick Actions</h3>
                <button class="quick-btn" onclick="quickAction('my orders')">
                    <span class="qicon">📦</span> My Orders
                </button>
                <button class="quick-btn" onclick="quickAction('find a product')">
                    <span class="qicon">🛍️</span> Find a Product
                </button>
                <button class="quick-btn" onclick="quickAction('what is your return policy')">
                    <span class="qicon">↩️</span> Return Policy
                </button>
                <button class="quick-btn" onclick="quickAction('I need help with an issue')">
                    <span class="qicon">🎫</span> Raise a Ticket
                </button>
            </div>
            <div class="sidebar-spacer"></div>
            <div class="sidebar-card">
                <div class="tip-header">
                    <span>💡</span>
                    <h3>Tip</h3>
                </div>
                <p class="tip-text">You can ask about your orders, returns, payments, or products.</p>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-container" id="chatContainer"></div>
            <div class="input-container">
                <button class="attach-btn" title="Attach file">📎</button>
                <input type="text" id="messageInput" placeholder="Type your message..." />
                <button id="sendButton">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    Send
                </button>
            </div>
        </div>
    </div>

    <script>
        marked.setOptions({ breaks: true, gfm: true });

        const STATUS_CONFIG = {
            delivered:          { label: 'Delivered',   color: '#15803d', bg: '#dcfce7', icon: '✓' },
            shipped:            { label: 'Shipped',     color: '#1d4ed8', bg: '#dbeafe', icon: '🚚' },
            'out for delivery': { label: 'Out for Delivery', color: '#1d4ed8', bg: '#dbeafe', icon: '🚚' },
            cancelled:          { label: 'Cancelled',  color: '#dc2626', bg: '#fee2e2', icon: '✕' },
            processing:         { label: 'Processing',  color: '#92400e', bg: '#fef3c7', icon: '⏳' },
            pending:            { label: 'Pending',     color: '#6b7280', bg: '#f3f4f6', icon: '○' },
        };

        function getTime() {
            return new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        }

        function parseOrderList(text) {
            const re = /•\s+\*\*(ORD-[\w-]+)\*\*\s*[-–]\s*(.+?)\s*\((cancelled|delivered|shipped|processing|pending|out for delivery)\)/gi;
            const orders = [];
            let m;
            while ((m = re.exec(text)) !== null) {
                orders.push({ id: m[1], name: m[2].trim(), status: m[3].toLowerCase() });
            }
            return orders.length >= 2 ? orders : null;
        }

        function stripOrderLines(text) {
            return text
                .replace(/•\s+\*\*ORD-[\w-]+\*\*\s*[-–]\s*.+?\s*\([\w\s]+\)\s*\n?/gi, '')
                .trim();
        }

        function buildOrderCards(orders) {
            const wrap = document.createElement('div');
            wrap.className = 'order-cards';
            for (const o of orders) {
                const cfg = STATUS_CONFIG[o.status] || STATUS_CONFIG.pending;
                const card = document.createElement('div');
                card.className = 'order-card';
                card.onclick = () => { messageInput.value = `status of ${o.id}`; sendMessage(); };
                card.innerHTML = `
                    <div class="order-icon" style="background:${cfg.bg};color:${cfg.color}">${cfg.icon}</div>
                    <div class="order-info">
                        <div class="order-id">${o.id}</div>
                        <div class="order-name">${o.name}</div>
                    </div>
                    <span class="status-badge" style="background:${cfg.bg};color:${cfg.color}">${cfg.label}</span>
                    <span class="order-chevron">›</span>`;
                wrap.appendChild(card);
            }
            return wrap;
        }

        function addMessage(text, className) {
            const row = document.createElement('div');
            row.className = `msg-row ${className}`;

            if (className === 'assistant') {
                const avatar = document.createElement('div');
                avatar.className = 'bot-avatar';
                avatar.textContent = '🤖';
                row.appendChild(avatar);
            }

            const col = document.createElement('div');
            col.className = 'msg-col';

            const orders = className === 'assistant' ? parseOrderList(text) : null;

            const bubble = document.createElement('div');
            bubble.className = `message ${className}`;

            if (orders) {
                const remainder = stripOrderLines(text);
                if (remainder) bubble.innerHTML = marked.parse(remainder);
                bubble.appendChild(buildOrderCards(orders));
            } else if (className === 'assistant') {
                bubble.innerHTML = marked.parse(text);
            } else {
                bubble.textContent = text;
            }

            col.appendChild(bubble);

            const meta = document.createElement('div');
            meta.className = 'msg-meta';
            meta.innerHTML = `<span>${getTime()}</span>${className === 'user' ? '<span class="tick">✓✓</span>' : ''}`;
            col.appendChild(meta);

            row.appendChild(col);
            chatContainer.appendChild(row);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return row;
        }

        // ── Auth state ──
        const token = localStorage.getItem('access_token');
        let isGuest = false;
        let sessionId = localStorage.getItem('chat_session_id') || null;

        if (token && localStorage.getItem('pending_session')) {
            sessionId = localStorage.getItem('pending_session');
            localStorage.removeItem('pending_session');
            localStorage.setItem('chat_session_id', sessionId);
            setTimeout(() => addMessage('✅ Signed in! You can now track your orders and raise tickets.', 'assistant'), 300);
        }

        const headerButtons = document.getElementById('headerButtons');
        if (!token) {
            isGuest = true;
            document.getElementById('userInfo').textContent = 'Browsing as Guest';
            document.getElementById('guestBanner').style.display = 'block';
            headerButtons.innerHTML = `
                <button class="btn-header" onclick="newChat()">💬 New Chat</button>
                <button class="btn-logout" onclick="signIn()">🔑 Sign In</button>`;
        } else {
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                document.getElementById('userInfo').textContent = `${payload.name} (${payload.email})`;
                headerButtons.innerHTML = `
                    <button class="btn-header" onclick="newChat()">💬 New Chat</button>
                    <button class="btn-logout" onclick="logout()">→ Logout</button>`;
            } catch(e) {
                isGuest = true;
                document.getElementById('userInfo').textContent = 'Session invalid';
                headerButtons.innerHTML = `<button class="btn-logout" onclick="window.location.href='/static/login.html'">🔑 Sign In</button>`;
            }
        }

        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');

        function showWelcome() {
            addMessage("Hi! I'm your AI shopping assistant. Ask me about your orders, products, or raise a support ticket.", 'assistant');
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            messageInput.value = '';
            sendButton.disabled = true;

            const typingRow = document.createElement('div');
            typingRow.className = 'typing-row';
            const tAvatar = document.createElement('div');
            tAvatar.className = 'bot-avatar';
            tAvatar.textContent = '🤖';
            const typingBubble = document.createElement('div');
            typingBubble.className = 'typing';
            typingBubble.innerHTML = '<span></span><span></span><span></span>';
            typingRow.appendChild(tAvatar);
            typingRow.appendChild(typingBubble);
            chatContainer.appendChild(typingRow);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const headers = { 'Content-Type': 'application/json' };
                if (token && !isGuest) headers['Authorization'] = `Bearer ${token}`;
                if (sessionId) headers['X-Session-ID'] = sessionId;

                const response = await fetch('/chat', { method: 'POST', headers, body: JSON.stringify({ message }) });
                const data = await response.json();
                typingRow.remove();

                if (response.ok) {
                    sessionId = data.session_id;
                    localStorage.setItem('chat_session_id', sessionId);
                    addMessage(data.response, 'assistant');
                } else if (response.status === 401) {
                    localStorage.removeItem('access_token');
                    addMessage('Your session expired. Please sign in again.', 'assistant');
                    setTimeout(() => window.location.href = '/static/login.html', 2000);
                } else {
                    addMessage(`Error: ${data.detail || 'Something went wrong'}`, 'assistant');
                }
            } catch (error) {
                typingRow.remove();
                addMessage(`Error: ${error.message}`, 'assistant');
            }

            sendButton.disabled = false;
            messageInput.focus();
        }

        function quickAction(text) {
            messageInput.value = text;
            sendMessage();
        }

        async function restoreHistory(sid) {
            try {
                const resp = await fetch(`/messages/${sid}`);
                if (!resp.ok) { localStorage.removeItem('chat_session_id'); showWelcome(); return; }
                const data = await resp.json();
                if (data.messages && data.messages.length > 0) {
                    for (const msg of data.messages) addMessage(msg.content, msg.role === 'user' ? 'user' : 'assistant');
                    return;
                }
            } catch(e) { /* fall through */ }
            showWelcome();
        }

        function newChat() {
            localStorage.removeItem('chat_session_id');
            sessionId = null;
            chatContainer.innerHTML = '';
            showWelcome();
        }

        function signIn() { window.location.href = '/static/login.html'; }

        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('pending_session');
            localStorage.removeItem('chat_session_id');
            window.location.href = '/static/chat.html';
        }

        if (sessionId) restoreHistory(sessionId);
        else showWelcome();

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
        messageInput.focus();
    </script>
</body>
</html>
