---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: multi-agent-system-postgres-data
  namespace: multi-agent
  annotations:
    # Never delete this PVC - it holds all application data
    kubectl.kubernetes.io/last-applied-configuration: ""
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-agent-system-postgres
  namespace: multi-agent
  labels:
    app.kubernetes.io/name: multi-agent-system
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: multi-agent-system
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multi-agent-system
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: multi-agent-system-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: multi_agent_db
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: multi-agent-system-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: multi-agent-system-postgres
  namespace: multi-agent
  labels:
    app.kubernetes.io/name: multi-agent-system
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: multi-agent-system
    app.kubernetes.io/component: postgres
