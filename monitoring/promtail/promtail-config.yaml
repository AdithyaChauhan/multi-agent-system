server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: multiagent-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: multiagent-app
          __path__: /logs/app.log
    pipeline_stages:
      - regex:
          expression: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d+ \| (?P<level>\w+) \|'
      - labels:
          level:
