# Product types: the catalog's source of truth (ADR 0005).
# Seeded into the product_types table by `scripts/enrich_catalog.py apply`; at runtime the database wins.
#
# Per type:
#   name, category, served (false = in the DB but not sold), synonyms (other words shoppers use),
#   suggestion (served: false only: what we offer instead), attributes.
# Per attribute:
#   type: enum (one value) | list (several values) | int | float | bool
#   values: enum/list only, {value: [aliases]}
#   unit, units: int/float only, the canonical unit and the words that mean it
#   aliases: bool only, words that mean true
#   required: counted in the "every required attribute filled" acceptance check
# An attribute named `kind` is special: its values are product words a shopper can search for
# ("pen drive" -> type storage, kind pen drive). A kind value named `other` is never a product word.
# When a shopper's word matches several entries, a type name wins over a synonym, and a synonym
# over a kind value.
# Keep 3-6 attributes per type and only fields shoppers filter on. Synonyms come from general
# shopping vocabulary, never from eval/product_queries.json (that would leak the test set).

types:
  # ── Computers & Accessories ───────────────────────────────────────────────
  - name: cable
    category: Computers & Accessories
    synonyms: [charging cable, data cable, wire, cord, charger cable]
    attributes:
      connectors:
        type: list
        required: true
        values:
          usb-a: [usb a, usb-a, usb 2.0, usb 3.0]
          usb-c: [type c, type-c, usb c, usb-c, c type]
          lightning: [lightning, iphone, apple, 8 pin, ltg]
          micro-usb: [micro usb, micro-usb, microusb, micro b, micro-b, v8]
          mini-usb: [mini usb, mini-usb, mini b, mini 5 pin, 5 pin]
          usb-b: [usb b, usb-b, b-male, b male, type b, printer cable]
          hdmi: [hdmi]
          displayport: [displayport, display port, dp]
          vga: [vga]
          ethernet: [ethernet, lan, rj45, cat6, cat5]
          aux-3.5mm: [aux, 3.5mm, 3.5 mm, audio jack]
          rca: [rca]
          sata: [sata]
          optical: [optical, toslink, spdif]
          power cord: [power cable, 3 pin, mains]
      length_m: {type: float, unit: m, units: [m, meter, meters, metre, metres, mtr]}
      watts: {type: int, unit: w, units: [w, watt, watts]}
      braided: {type: bool, aliases: [braided, nylon braided]}

