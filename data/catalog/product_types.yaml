          wireless: [wireless, cordless, 2.4ghz, 2.4 ghz, bluetooth, bt]  # to a shopper, bluetooth is wireless
      gaming: {type: bool, aliases: [gaming, gamer, rgb]}
      silent: {type: bool, aliases: [silent, noiseless, quiet click]}

  - name: keyboard
    category: Computers & Accessories
