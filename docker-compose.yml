version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: multiagent-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: multi_agent_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql
      - ./data/catalog.sql:/docker-entrypoint-initdb.d/01_catalog.sql
      - ./data/orders.sql:/docker-entrypoint-initdb.d/02_orders.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multiagent-app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:mypassword@db:5432/multi_agent_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./app/static:/app/app/static
    restart: unless-stopped

  mock-carrier-api:
    build:
      context: .
      dockerfile: mock_services/Dockerfile
    container_name: multiagent-mock-api
    ports:
      - "9000:9000"
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    container_name: multiagent-loki
    user: "0"
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: multiagent-promtail
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yaml
      - ./logs:/logs
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.0
    container_name: multiagent-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  postgres_data:
  loki_data:
  grafana_data: